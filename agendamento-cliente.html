<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendamento Online</title>
<style>
  :root {
    --cor-primaria: #0d1b3e;
    --cor-secundaria: #c9a24b;
    --bg: #f5f6fa;
    --bg-card: #fff;
    --borda: #e5e7eb;
    --texto: #1a1a2e;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--texto); min-height: 100vh; }
  header { background: var(--cor-primaria); color: #fff; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  header img { width: 44px; height: 44px; border-radius: 8px; object-fit: contain; background: #fff; padding: 3px; }
  header .nome { font-size: 18px; font-weight: 700; }
  header .sub { font-size: 12px; opacity: .7; }
  .container { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }
  .card { background: var(--bg-card); border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); border: 1px solid var(--borda); }
  h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: var(--cor-primaria); }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #6b7280; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
  select, input { width: 100%; padding: 10px 12px; border: 1px solid var(--borda); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--bg-card); color: var(--texto); }
  select:focus, input:focus { outline: 2px solid var(--cor-secundaria); border-color: transparent; }
  .btn { display: inline-block; padding: 12px 22px; border-radius: 8px; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; border: none; transition: opacity .15s; }
  .btn:hover { opacity: .88; }
  .btn-primary { background: var(--cor-primaria); color: #fff; width: 100%; }
  .btn-gold { background: var(--cor-secundaria); color: #fff; width: 100%; }
  .horarios-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-top: 8px; }
  .slot { padding: 9px 6px; border: 2px solid var(--borda); border-radius: 8px; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; background: var(--bg-card); }
  .slot:hover { border-color: var(--cor-primaria); background: #f0f4ff; }
  .slot.selecionado { border-color: var(--cor-primaria); background: var(--cor-primaria); color: #fff; }
  .slot.ocupado { background: #f3f4f6; color: #d1d5db; cursor: not-allowed; border-color: #e5e7eb; }
  .dias-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
  .dia { padding: 8px 4px; text-align: center; border: 2px solid var(--borda); border-radius: 8px; cursor: pointer; transition: all .15s; }
  .dia:hover:not(.bloqueado) { border-color: var(--cor-primaria); background: #f0f4ff; }
  .dia.selecionado { border-color: var(--cor-primaria); background: var(--cor-primaria); color: #fff; }
  .dia.bloqueado { color: #d1d5db; cursor: not-allowed; }
  .dia .dd { font-size: 15px; font-weight: 800; }
  .dia .mm { font-size: 10px; }
  .dia .dw { font-size: 10px; color: #9ca3af; }
  .dia.selecionado .dw { color: rgba(255,255,255,.7); }
  .empty-msg { text-align: center; color: #9ca3af; font-size: 13px; padding: 20px 0; }
  .badge-online { display: inline-block; background: #d1fae5; color: #065f46; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .step-indicator { display: flex; gap: 6px; margin-bottom: 20px; }
  .step { flex: 1; height: 4px; border-radius: 2px; background: var(--borda); transition: background .3s; }
  .step.ativo { background: var(--cor-primaria); }
  .step.feito { background: var(--cor-secundaria); }
  .resumo-linha { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--borda); font-size: 13px; }
  .resumo-linha:last-child { border-bottom: none; }
  .alert { background: #fef3c7; border: 1px solid #fcd34d; border-radius: 8px; padding: 12px 14px; font-size: 13px; margin-bottom: 14px; }
  #telaConfirmado { display: none; padding: 30px 0; }
  .confirmado-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 14px; padding: 28px 20px; text-align: center; margin-bottom: 16px; }
  .confirmado-box .icon { font-size: 52px; margin-bottom: 10px; }
  .confirmado-box h2 { color: #059669; margin-bottom: 6px; font-size: 20px; }
  .confirmado-box .num-agend { display: inline-block; background: #059669; color: #fff; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 3px 12px; margin-bottom: 10px; }
  .confirmado-box p { color: #374151; font-size: 14px; line-height: 1.6; }
  /* Meus agendamentos */
  .meus-agend-lista { margin-top: 12px; }
  .agend-card { border: 1px solid var(--borda); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; background: var(--bg-card); }
  .agend-card .agend-serv { font-weight: 700; font-size: 15px; color: var(--cor-primaria); margin-bottom: 4px; }
  .agend-card .agend-meta { font-size: 13px; color: #6b7280; margin-bottom: 8px; }
  .agend-card .agend-status { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
  .status-confirmado { background: #d1fae5; color: #065f46; }
  .status-cancelado { background: #fee2e2; color: #991b1b; }
  .btn-cancelar { background: #fee2e2; color: #b91c1c; border: none; border-radius: 7px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 8px; }
  .btn-cancelar:hover { background: #fecaca; }
</style>
</head>
<body>

<header id="headerNegocio">
  <div>
    <div class="nome" id="headerNome">Carregando...</div>
    <div class="sub">Agendamento online</div>
  </div>
</header>

<div class="container" id="telaAgendamento">
  <div style="margin-top:16px;margin-bottom:4px">
    <div class="step-indicator" id="stepIndicator">
      <div class="step ativo" id="step1"></div>
      <div class="step" id="step2"></div>
      <div class="step" id="step3"></div>
      <div class="step" id="step4"></div>
    </div>
  </div>

  <!-- Passo 1: Serviço e profissional -->
  <div id="passo1">
    <div class="card">
      <h2>1. Escolha o serviço</h2>
      <div class="field">
        <label>Serviço</label>
        <select id="selServico">
          <option value="">Selecione...</option>
        </select>
      </div>
      <div class="field" id="campoProfissional" style="display:none">
        <label>Profissional</label>
        <select id="selProfissional">
          <option value="">Qualquer disponível</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btnPasso1">Escolher data →</button>
    </div>
  </div>

  <!-- Passo 2: Data -->
  <div id="passo2" style="display:none">
    <div class="card">
      <h2>2. Escolha o dia</h2>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <button class="btn" id="btnMesAnterior" style="padding:6px 12px;background:#f3f4f6;color:#374151;font-size:16px">‹</button>
        <span id="labelMes" style="font-weight:700;font-size:15px;flex:1;text-align:center"></span>
        <button class="btn" id="btnProximoMes" style="padding:6px 12px;background:#f3f4f6;color:#374151;font-size:16px">›</button>
      </div>
      <div class="dias-grid" id="gradeCalMes"></div>
    </div>
    <button class="btn" style="background:#f3f4f6;color:#374151;margin-bottom:8px" id="btnVoltarPasso1">← Voltar</button>
  </div>

  <!-- Passo 3: Horário -->
  <div id="passo3" style="display:none">
    <div class="card">
      <h2>3. Escolha o horário</h2>
      <p id="labelDataSelecionada" style="font-size:13px;color:#6b7280;margin-bottom:12px"></p>
      <div class="horarios-grid" id="gradeHorarios"></div>
    </div>
    <button class="btn" style="background:#f3f4f6;color:#374151;margin-bottom:8px" id="btnVoltarPasso2">← Voltar</button>
  </div>

  <!-- Passo 4: Dados do cliente e confirmação -->
  <div id="passo4" style="display:none">
    <div class="card">
      <h2>4. Seus dados</h2>
      <div class="field">
        <label>Nome completo *</label>
        <input type="text" id="cliNome" placeholder="Seu nome">
      </div>
      <div class="field">
        <label>WhatsApp *</label>
        <input type="tel" id="cliTelefone" placeholder="(11) 99999-9999">
      </div>
      <div class="field">
        <label>CPF</label>
        <input type="text" id="cliCpf" placeholder="000.000.000-00">
      </div>
    </div>
    <div class="card">
      <h2>Resumo do agendamento</h2>
      <div id="resumoAgendamento"></div>
    </div>
    <button class="btn btn-gold" id="btnConfirmar">✅ Confirmar agendamento</button>
    <button class="btn" style="background:#f3f4f6;color:#374151;margin-top:8px" id="btnVoltarPasso3">← Voltar</button>
  </div>
</div>

<!-- Tela de confirmado -->
<div id="telaConfirmado" class="container">
  <div class="confirmado-box">
    <div class="icon">🎉</div>
    <h2>Agendamento confirmado!</h2>
    <div class="num-agend" id="numAgend"></div>
    <p id="msgConfirmado"></p>
  </div>
  <div style="display:flex;gap:10px;flex-direction:column">
    <button class="btn btn-gold" id="btnVerMeusAgendamentos">📋 Ver meus agendamentos</button>
    <button class="btn" style="background:#f3f4f6;color:#374151" id="btnNovoAgendamento">+ Fazer outro agendamento</button>
  </div>
</div>

<!-- Tela: Meus agendamentos -->
<div id="telaMeusAgendamentos" style="display:none" class="container">
  <div class="card" style="margin-top:4px">
    <h2>📋 Meus agendamentos</h2>
    <div class="field">
      <label>Seu WhatsApp</label>
      <input type="tel" id="buscarTelefone" placeholder="(11) 99999-9999">
    </div>
    <button class="btn btn-primary" id="btnBuscarAgendamentos">Buscar</button>
  </div>
  <div id="resultadoMeusAgend" class="meus-agend-lista"></div>
  <button class="btn" style="background:#f3f4f6;color:#374151;margin-top:4px" id="btnVoltarConfirmado">← Voltar</button>
</div>

<!-- Erro / Salão não encontrado -->
<div id="telaErro" style="display:none" class="container">
  <div class="card" style="text-align:center;padding:40px 20px;margin-top:20px">
    <div style="font-size:48px;margin-bottom:12px">😔</div>
    <h2 style="color:#b3261e;margin-bottom:8px">Salão não encontrado</h2>
    <p style="color:#6b7280;font-size:14px">Verifique o link e tente novamente.</p>
  </div>
</div>

<script>
(function () {
  // ---------- Parâmetros da URL ----------
  const params = new URLSearchParams(location.search);
  const negocioId = params.get('negocio');
  const STORAGE_KEY_CLIENTES = 'salao_clientes';
  const STORAGE_KEY_AGENDAMENTOS = 'salao_agendamentos';
  const STORAGE_KEY_CONFIG = 'salao_config';
  const STORAGE_KEY_SERVICOS = 'salao_servicos';
  const STORAGE_KEY_PROFISSIONAIS = 'salao_profissionais';

  function load(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; } }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function isoHoje() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function isoLocal(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function formatDateBR(iso) { if (!iso) return ''; const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; }
  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ---------- Carregar dados do localStorage (mesmo navegador/computador) ----------
  const config = load(STORAGE_KEY_CONFIG, {});
  if (!config.negocioId) { mostrarErro(); return; }
  if (negocioId && config.negocioId !== negocioId) { mostrarErro(); return; }

  const servicos = load(STORAGE_KEY_SERVICOS, []);
  const profissionais = load(STORAGE_KEY_PROFISSIONAIS, []);
  let agendamentos = load(STORAGE_KEY_AGENDAMENTOS, []);
  let clientes = load(STORAGE_KEY_CLIENTES, []);

  // Aplicar cores e nome
  const cor = config.corPrimaria || '#0d1b3e';
  const corSec = config.corSecundaria || '#c9a24b';
  document.documentElement.style.setProperty('--cor-primaria', cor);
  document.documentElement.style.setProperty('--cor-secundaria', corSec);
  document.getElementById('headerNome').textContent = config.nomeNegocio || 'Salão';
  if (config.logo) {
    const img = document.createElement('img');
    img.src = config.logo; img.alt = '';
    document.getElementById('headerNegocio').prepend(img);
  }

  // Horário de funcionamento
  const abStr = config.horarioAbertura || '08:00';
  const feStr = config.horarioFechamento || '19:00';
  const intervalo = config.intervaloGrade || 30;

  function gerarSlots() {
    const [ah, am] = abStr.split(':').map(Number);
    const [fh, fm] = feStr.split(':').map(Number);
    const slots = [];
    let h = ah, m = am;
    while (h * 60 + m <= fh * 60 + fm) {
      slots.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
      m += intervalo; if (m >= 60) { h++; m -= 60; }
    }
    return slots;
  }

  // ---------- Estado do fluxo ----------
  let passoAtual = 1;
  let servicoId = '', profissionalId = '', dataSel = '', horaSel = '';
  let calMesOffset = 0;

  // ---------- Preencher serviços ----------
  const sel = document.getElementById('selServico');
  servicos.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = `${s.nome} — ${s.duracao} min`; sel.appendChild(o); });
  if (!servicos.length) { sel.innerHTML = '<option>Nenhum serviço cadastrado</option>'; }

  sel.addEventListener('change', () => {
    servicoId = sel.value;
    const campoPro = document.getElementById('campoProfissional');
    const selPro = document.getElementById('selProfissional');
    selPro.innerHTML = '<option value="">Qualquer disponível</option>';
    if (servicoId) {
      profissionais.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = p.nome + (p.especialidade ? ' · ' + p.especialidade : ''); selPro.appendChild(o); });
      campoPro.style.display = profissionais.length ? '' : 'none';
    } else campoPro.style.display = 'none';
  });

  document.getElementById('btnPasso1').addEventListener('click', () => {
    if (!servicoId) { alert('Selecione um serviço.'); return; }
    profissionalId = document.getElementById('selProfissional').value;
    irParaPasso(2);
    renderCalMes();
  });

  // ---------- Calendário de mês ----------
  const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const DW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  function renderCalMes() {
    const hoje = new Date();
    const ref = new Date(hoje.getFullYear(), hoje.getMonth() + calMesOffset, 1);
    document.getElementById('labelMes').textContent = `${MESES[ref.getMonth()]} ${ref.getFullYear()}`;
    const grade = document.getElementById('gradeCalMes');
    grade.innerHTML = '';

    // Cabeçalho dias da semana
    DW.forEach(d => { const el = document.createElement('div'); el.textContent = d; el.style.cssText = 'text-align:center;font-size:10px;font-weight:700;color:#9ca3af;padding:4px 0'; grade.appendChild(el); });

    const primeiroDia = new Date(ref.getFullYear(), ref.getMonth(), 1);
    const ultimoDia = new Date(ref.getFullYear(), ref.getMonth() + 1, 0);
    const offset = primeiroDia.getDay(); // 0=dom
    for (let i = 0; i < offset; i++) { const el = document.createElement('div'); grade.appendChild(el); }

    // Dias disponíveis do serviço selecionado
    const servSel = servicos.find(s => s.id === servicoId);
    const diasDispServ = servSel && servSel.diasDisp ? servSel.diasDisp : [0,1,2,3,4,5,6];

    for (let dia = 1; dia <= ultimoDia.getDate(); dia++) {
      const d = new Date(ref.getFullYear(), ref.getMonth(), dia);
      const iso = isoLocal(d);
      const passado = iso < isoHoje();
      const diaIndisponivel = !diasDispServ.includes(d.getDay());
      const bloqueado = passado || diaIndisponivel;
      const el = document.createElement('div');
      el.className = 'dia' + (bloqueado ? ' bloqueado' : '') + (iso === dataSel ? ' selecionado' : '');
      if (diaIndisponivel && !passado) el.title = 'Serviço não disponível neste dia';
      el.innerHTML = `<div class="dw">${DW[d.getDay()]}</div><div class="dd">${dia}</div>`;
      if (!bloqueado) {
        el.addEventListener('click', () => {
          dataSel = iso;
          irParaPasso(3);
          renderHorarios();
        });
      }
      grade.appendChild(el);
    }
  }

  document.getElementById('btnMesAnterior').addEventListener('click', () => { calMesOffset = Math.max(0, calMesOffset - 1); renderCalMes(); });
  document.getElementById('btnProximoMes').addEventListener('click', () => { calMesOffset++; renderCalMes(); });

  // ---------- Horários ----------
  function renderHorarios() {
    document.getElementById('labelDataSelecionada').textContent = `Data: ${formatDateBR(dataSel)}`;

    // Usar horário do serviço se configurado, senão horário geral do salão
    const servSel = servicos.find(s => s.id === servicoId);
    const inicioEfetivo = (servSel && servSel.horarioInicio) ? servSel.horarioInicio : abStr;
    const fimEfetivo = (servSel && servSel.horarioFim) ? servSel.horarioFim : feStr;

    function gerarSlotsServico() {
      const [ah, am] = inicioEfetivo.split(':').map(Number);
      const [fh, fm] = fimEfetivo.split(':').map(Number);
      const slots = [];
      let h = ah, m = am;
      while (h * 60 + m <= fh * 60 + fm) {
        slots.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
        m += intervalo; if (m >= 60) { h++; m -= 60; }
      }
      return slots;
    }

    const slots = gerarSlotsServico();
    const duracaoServico = servSel ? (servSel.duracao || intervalo) : intervalo;

    // Converte "HH:MM" em minutos totais
    function toMin(h) { const [hh, mm] = h.split(':').map(Number); return hh * 60 + mm; }

    // Agendamentos do dia filtrados pelo profissional (se escolhido)
    const agendsDia = agendamentos.filter(a => a.data === dataSel && (profissionalId ? a.profissionalId === profissionalId : true));

    // Verifica se um slot está bloqueado por algum agendamento existente
    // Um slot fica bloqueado se:
    //   (A) já existe agendamento que começa nele, OU
    //   (B) existe agendamento anterior cuja duração ainda não terminou ao chegar neste slot
    function slotOcupado(hora) {
      const minSlot = toMin(hora);
      return agendsDia.some(a => {
        const servA = servicos.find(s => s.id === a.servicoId);
        const durA = servA ? (servA.duracao || intervalo) : intervalo;
        const inicio = toMin(a.hora);
        const fim = inicio + durA;
        // o slot está dentro do intervalo ocupado pelo agendamento existente
        return minSlot >= inicio && minSlot < fim;
      });
    }

    // Verifica se, ao agendar neste slot, o tempo do novo serviço caberia
    // sem conflitar com o próximo agendamento existente
    function slotConflitaFuturo(hora) {
      const minSlot = toMin(hora);
      const fimNovo = minSlot + duracaoServico;
      return agendsDia.some(a => {
        const inicioA = toMin(a.hora);
        return inicioA > minSlot && inicioA < fimNovo;
      });
    }

    // Disponibilidade do profissional escolhido
    const prof = profissionalId ? profissionais.find(p => p.id === profissionalId) : null;
    const diaSemana = dataSel ? new Date(dataSel + 'T12:00:00').getDay() : -1;
    function foraDaDispProf(hora) {
      if (!prof) return false;
      const diasDisp = prof.diasDisp || [1,2,3,4,5];
      if (!diasDisp.includes(diaSemana)) return true;
      const [hh, mm] = hora.split(':').map(Number);
      const [ih, im] = (prof.horarioInicio || inicioEfetivo).split(':').map(Number);
      const [fh, fm] = (prof.horarioFim || fimEfetivo).split(':').map(Number);
      return hh * 60 + mm < ih * 60 + im || hh * 60 + mm > fh * 60 + fm;
    }

    // O serviço novo precisa caber antes do horário de fechamento
    function naoCobeNoHorario(hora) {
      const [fh, fm] = fimEfetivo.split(':').map(Number);
      return toMin(hora) + duracaoServico > fh * 60 + fm;
    }

    const grade = document.getElementById('gradeHorarios');
    grade.innerHTML = '';
    if (!slots.length) { grade.innerHTML = '<div class="empty-msg">Nenhum horário disponível.</div>'; return; }
    let algumDisp = false;
    slots.forEach(hora => {
      const el = document.createElement('div');
      const ocupado = slotOcupado(hora) || slotConflitaFuturo(hora) || foraDaDispProf(hora) || naoCobeNoHorario(hora);
      if (!ocupado) algumDisp = true;
      el.className = 'slot' + (ocupado ? ' ocupado' : '') + (hora === horaSel ? ' selecionado' : '');
      el.textContent = hora;
      if (!ocupado) {
        el.addEventListener('click', () => {
          horaSel = hora;
          document.querySelectorAll('.slot').forEach(s => s.classList.remove('selecionado'));
          el.classList.add('selecionado');
          irParaPasso(4);
          renderResumo();
        });
      }
      grade.appendChild(el);
    });
    if (!algumDisp) grade.innerHTML = '<div class="empty-msg">Nenhum horário disponível neste dia.</div>';
  }

  // ---------- Resumo e confirmação ----------
  function renderResumo() {
    const serv = servicos.find(s => s.id === servicoId);
    const prof = profissionais.find(p => p.id === profissionalId);
    document.getElementById('resumoAgendamento').innerHTML = `
      <div class="resumo-linha"><span>Serviço</span><strong>${esc(serv ? serv.nome : '?')}</strong></div>
      ${prof ? `<div class="resumo-linha"><span>Profissional</span><strong>${esc(prof.nome)}</strong></div>` : ''}
      <div class="resumo-linha"><span>Data</span><strong>${formatDateBR(dataSel)}</strong></div>
      <div class="resumo-linha"><span>Horário</span><strong>${horaSel}</strong></div>
      ${serv ? `<div class="resumo-linha"><span>Duração</span><strong>${serv.duracao} min</strong></div>` : ''}
      ${serv && serv.preco ? `<div class="resumo-linha"><span>Valor</span><strong>R$ ${Number(serv.preco).toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong></div>` : ''}
    `;
  }

  document.getElementById('btnConfirmar').addEventListener('click', () => {
    const nome = document.getElementById('cliNome').value.trim();
    const tel = document.getElementById('cliTelefone').value.trim();
    const cpf = document.getElementById('cliCpf').value.trim();
    if (!nome) { alert('Informe seu nome.'); return; }
    if (!tel) { alert('Informe seu WhatsApp.'); return; }

    agendamentos = load(STORAGE_KEY_AGENDAMENTOS, []);
    clientes = load(STORAGE_KEY_CLIENTES, []);

    // Verificar conflito com duração (releitura fresca do localStorage para evitar concorrência)
    const servConf = servicos.find(s => s.id === servicoId);
    const durConf = servConf ? (servConf.duracao || intervalo) : intervalo;
    function toMinC(h) { const [hh, mm] = h.split(':').map(Number); return hh * 60 + mm; }
    const minNovo = toMinC(horaSel);
    const fimNovo = minNovo + durConf;
    const agendsDiaConf = agendamentos.filter(a => a.data === dataSel && (profissionalId ? a.profissionalId === profissionalId : true));
    const conflito = agendsDiaConf.some(a => {
      const servA = servicos.find(s => s.id === a.servicoId);
      const durA = servA ? (servA.duracao || intervalo) : intervalo;
      const inicioA = toMinC(a.hora);
      const fimA = inicioA + durA;
      return minNovo < fimA && fimNovo > inicioA; // sobreposição
    });
    if (conflito) { alert('Este horário acabou de ser ocupado. Por favor escolha outro.'); irParaPasso(3); renderHorarios(); return; }

    // Encontrar ou criar cliente
    let cli = clientes.find(c => c.telefone && c.telefone.replace(/\D/g,'') === tel.replace(/\D/g,''));
    if (!cli) {
      const nextNum = clientes.reduce((mx, c) => Math.max(mx, c._num || 0), 0) + 1;
      cli = { id: uid(), _num: nextNum, nome, telefone: tel, cpf, criadoEm: isoHoje(), dataAvaliacao: isoHoje(), statusCliente: { valor: 'avaliacao', motivo: 'Novo cadastro online', atualizadoEm: new Date().toISOString() }, evolucoes: [], orcamentos: [], tratamentos: [], anamneseCapilar: {}, anamneseManicure: {}, anamneseCilios: {}, anamneseSobrancelha: {}, anamneseDepilacao: {} };
      clientes.push(cli);
      save(STORAGE_KEY_CLIENTES, clientes);
    }

    // Profissional: se não escolheu, pegar o disponível
    let profId = profissionalId;
    if (!profId && profissionais.length) {
      const ocupados = new Set(agendamentos.filter(a => a.data === dataSel && a.hora === horaSel).map(a => a.profissionalId));
      const disp = profissionais.find(p => !ocupados.has(p.id));
      profId = disp ? disp.id : (profissionais[0] ? profissionais[0].id : '');
    }

    const novoAgend = { id: uid(), data: dataSel, hora: horaSel, clienteId: cli.id, servicoId, profissionalId: profId, origem: 'online' };
    agendamentos.push(novoAgend);
    save(STORAGE_KEY_AGENDAMENTOS, agendamentos);

    const serv = servicos.find(s => s.id === servicoId);
    const prof = profissionais.find(p => p.id === profId);
    const numAgend = agendamentos.filter(a => a.origem === 'online').length;
    document.getElementById('numAgend').textContent = `#${String(numAgend).padStart(4,'0')}`;
    document.getElementById('msgConfirmado').innerHTML = `
      <strong>${esc(serv ? serv.nome : 'Serviço')}</strong><br>
      ${prof ? `Profissional: <strong>${esc(prof.nome)}</strong><br>` : ''}
      📅 <strong>${formatDateBR(dataSel)}</strong> às <strong>${horaSel}</strong><br><br>
      Aguardamos você, <strong>${esc(nome)}</strong>! 😊
    `;
    document.getElementById('telaAgendamento').style.display = 'none';
    document.getElementById('telaConfirmado').style.display = '';
    // Pré-preencher telefone para busca rápida
    document.getElementById('buscarTelefone').value = tel;
  });

  document.getElementById('btnNovoAgendamento').addEventListener('click', () => {
    servicoId = ''; profissionalId = ''; dataSel = ''; horaSel = '';
    document.getElementById('selServico').value = '';
    document.getElementById('cliNome').value = '';
    document.getElementById('cliTelefone').value = '';
    document.getElementById('cliCpf').value = '';
    calMesOffset = 0;
    document.getElementById('telaConfirmado').style.display = 'none';
    document.getElementById('telaAgendamento').style.display = '';
    irParaPasso(1);
  });

  // ---------- Ver meus agendamentos ----------
  document.getElementById('btnVerMeusAgendamentos').addEventListener('click', () => {
    document.getElementById('telaConfirmado').style.display = 'none';
    document.getElementById('telaMeusAgendamentos').style.display = '';
    buscarMeusAgendamentos();
  });

  document.getElementById('btnVoltarConfirmado').addEventListener('click', () => {
    document.getElementById('telaMeusAgendamentos').style.display = 'none';
    document.getElementById('telaConfirmado').style.display = '';
  });

  document.getElementById('btnBuscarAgendamentos').addEventListener('click', buscarMeusAgendamentos);
  document.getElementById('buscarTelefone').addEventListener('keydown', e => { if (e.key === 'Enter') buscarMeusAgendamentos(); });

  function buscarMeusAgendamentos() {
    const tel = document.getElementById('buscarTelefone').value.trim().replace(/\D/g,'');
    const div = document.getElementById('resultadoMeusAgend');
    if (!tel) { div.innerHTML = '<p style="color:#9ca3af;text-align:center;padding:16px">Digite seu WhatsApp para buscar.</p>'; return; }

    const agendsFresh = load(STORAGE_KEY_AGENDAMENTOS, []);
    const clientesFresh = load(STORAGE_KEY_CLIENTES, []);

    const cli = clientesFresh.find(c => c.telefone && c.telefone.replace(/\D/g,'') === tel);
    if (!cli) { div.innerHTML = '<p style="color:#9ca3af;text-align:center;padding:16px">Nenhum agendamento encontrado para este número.</p>'; return; }

    const hoje = isoHoje();
    // Ordenar: futuros primeiro, depois passados
    const meus = agendsFresh
      .filter(a => a.clienteId === cli.id)
      .sort((a, b) => (a.data + a.hora) < (b.data + b.hora) ? 1 : -1);

    if (!meus.length) { div.innerHTML = '<p style="color:#9ca3af;text-align:center;padding:16px">Nenhum agendamento encontrado.</p>'; return; }

    const MESES_ABR = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    div.innerHTML = meus.map(a => {
      const serv = servicos.find(s => s.id === a.servicoId);
      const prof = profissionais.find(p => p.id === a.profissionalId);
      const cancelado = a.canceladoCliente;
      const passado = a.data < hoje;
      const podeCanc = !cancelado && !passado;
      const [ay, am, ad] = a.data.split('-');
      const dataFmt = `${parseInt(ad)} de ${MESES_ABR[parseInt(am)-1]} de ${ay}`;
      return `<div class="agend-card">
        <div class="agend-serv">${esc(serv ? serv.nome : 'Serviço')}</div>
        <div class="agend-meta">
          📅 ${dataFmt} às ${a.hora}
          ${prof ? `· <span>👤 ${esc(prof.nome)}</span>` : ''}
          ${serv && serv.duracao ? `· ⏱ ${serv.duracao} min` : ''}
        </div>
        <span class="agend-status ${cancelado ? 'status-cancelado' : 'status-confirmado'}">${cancelado ? '✗ Cancelado' : passado ? '✓ Realizado' : '✓ Confirmado'}</span>
        ${podeCanc ? `<br><button class="btn-cancelar" data-cancel-id="${a.id}">Cancelar agendamento</button>` : ''}
      </div>`;
    }).join('');

    // Listener de cancelamento
    div.querySelectorAll('[data-cancel-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!confirm('Tem certeza que deseja cancelar este agendamento?')) return;
        const agendsMut = load(STORAGE_KEY_AGENDAMENTOS, []);
        const idx = agendsMut.findIndex(a => a.id === btn.dataset.cancelId);
        if (idx !== -1) { agendsMut[idx].canceladoCliente = true; save(STORAGE_KEY_AGENDAMENTOS, agendsMut); agendamentos = agendsMut; }
        buscarMeusAgendamentos();
      });
    });
  }

  // Botões voltar
  document.getElementById('btnVoltarPasso1').addEventListener('click', () => irParaPasso(1));
  document.getElementById('btnVoltarPasso2').addEventListener('click', () => irParaPasso(2));
  document.getElementById('btnVoltarPasso3').addEventListener('click', () => irParaPasso(3));

  // ---------- Navegação entre passos ----------
  function irParaPasso(n) {
    passoAtual = n;
    [1,2,3,4].forEach(i => {
      document.getElementById('passo' + i).style.display = i === n ? '' : 'none';
      const step = document.getElementById('step' + i);
      step.className = 'step' + (i < n ? ' feito' : i === n ? ' ativo' : '');
    });
  }

  function mostrarErro() {
    document.getElementById('telaAgendamento').style.display = 'none';
    document.getElementById('telaErro').style.display = '';
    document.getElementById('headerNome').textContent = 'Agendamento Online';
  }

  // Iniciar no passo 1
  irParaPasso(1);

})();
</script>
</body>
</html>
